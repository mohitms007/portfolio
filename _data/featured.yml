- name: Covenant Desk
  kind: AI agent
  url: https://covenant-desk.onrender.com
  code: https://github.com/mohitmsh/covenant-desk
  image: covenant-desk.jpg
  alt: Covenant Desk run review, where the compliance certificate disagrees with the tested covenant results
  summary: An AI agent that reads a borrower's monthly reporting pack, extracts each figure with a quote from the page, and flags where the compliance certificate disagrees with the tested covenants. Code, not the model, does every calculation and rejects any figure it can't find on the page.
  facts:
    - label: Evals
      value: 8 of 8 cases, 119 of 119 checks
    - label: Model cost
      value: $0.047 per eval run
    - label: Safety
      value: Prompt-injection test case
  stack:
    - Claude API
    - TypeScript
    - React
    - Hono
    - Postgres

