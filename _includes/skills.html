<section class="section" id="skills">
  <header class="section__head">
    <h2 class="section__title">Skills</h2>
  </header>

  <div class="grid grid--3">
    {% for group in site.data.skills %}
    <div class="card skill-group{% if forloop.first %} skill-group--accent{% endif %}">
      <div class="skill-group__head">
        <span class="skill-group__label">{{group.label}}</span>
        <span class="count">{{group.items | size}}</span>
      </div>
      <div class="tags">
        {% for item in group.items %}<span class="tag">{{item}}</span>{% endfor %}
      </div>
    </div>
    {% endfor %}
  </div>
</section>
