<header class="header">
  <a class="header__name" href="{{site.baseurl}}/">
    <img class="header__avatar" src="{{site.baseurl}}/img/avatar.jpg" alt="Mohit Sharma" width="40" height="40">
    <span>Mohit Sharma</span>
  </a>
  <div class="header__links">
    {% include social.html %}
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch between light and dark mode">
      <span class="theme-toggle__sun">{% include icons/sun.svg %}</span>
      <span class="theme-toggle__moon">{% include icons/moon.svg %}</span>
    </button>
  </div>
</header>
