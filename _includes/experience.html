<section class="section" id="experience">
  <h2 class="section__title">Experience</h2>
  <ul class="jobs">
    {% for job in site.data.experience %}
    <li>
      <details class="job">
        <summary class="job__row">
          {% if job.logo %}<img class="job__logo" src="{{site.baseurl}}/img/logos/{{job.logo}}" alt="" width="20" height="20">{% else %}<span class="job__logo job__logo--initial" aria-hidden="true">{{job.initial}}</span>{% endif %}
          <span class="job__company">{{job.company}}</span>
          <span class="job__role muted">{{job.position}}</span>
          <span class="job__time">{{job.time}}</span>
        </summary>
        <ul class="job__details">
          {% for detail in job.details limit:2 %}<li>{{detail}}</li>{% endfor %}
        </ul>
      </details>
    </li>
    {% endfor %}
  </ul>
</section>
