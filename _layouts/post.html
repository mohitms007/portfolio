---
layout: default
---

<div class="page">
  {% include header.html %}
  <main>
    <p class="post__back"><a href="{{site.baseurl}}/#writing">← Writing</a></p>
    <article class="post">
      <header class="post__head">
        <h1 class="post__title">{{ page.title }}</h1>
        <time class="job__time" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %b %Y' }}</time>
      </header>
      <div class="post__body">
        {{ content }}
      </div>
    </article>
  </main>
  {% include footer.html %}
</div>
